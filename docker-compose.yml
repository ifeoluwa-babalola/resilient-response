services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resilient_postgres
    environment:
      POSTGRES_DB: emergency_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: resilient_redis
    ports:
      - "6379:6379"