version: '3.8'

services:
  # Database service with PostGIS spatial capabilities
  postgres:
    image: postgis/postgis:16-3.4
    container_name: resilient_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: emergency_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d emergency_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis service for event stream processing
  redis:
    image: redis:7-alpine
    container_name: resilient_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: