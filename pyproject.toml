[project]
name = "resilient-response"
version = "0.1.0"
description = "Resilient emergency incident response platform"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "uvicorn",
    "asyncpg",
    "redis",
    "pydantic",
    "httpx"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"